<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字化转型业务挑战</title>
  <meta name="description" content="5个不同行业业务主体的数字化转型互动闯关网页，用故事线理解 SOP、AI workflow 与 agentic workflow。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop backdrop-a"></div>
  <div class="backdrop backdrop-b"></div>

  <main class="app-shell">
    <section id="stage" class="stage card" aria-live="polite">
      <div class="stage-frame">
        <div class="stage-header">
          <div>
            <p class="eyebrow">Digital Transformation Challenge</p>
            <div id="page-progress" class="page-progress">Business Directory</div>
          </div>
          <div class="header-actions">
            <button id="home-ghost" class="ghost-button hidden" type="button">返回主页</button>
            <button id="restart-ghost" class="ghost-button hidden" type="button">重新开始</button>
          </div>
        </div>

        <div id="stage-content" class="stage-content"></div>
      </div>
    </section>

    <aside class="sidebar card">
      <section class="sidebar-block metrics-block">
        <div class="block-heading">
          <p class="eyebrow">Business Status</p>
          <h2>经营指标</h2>
        </div>
        <div id="metrics" class="metrics-list"></div>
      </section>

      <section class="sidebar-block guidance-block">
        <div class="block-heading">
          <p class="eyebrow">Judgement Hint</p>
          <h2>判断提示</h2>
        </div>
        <div id="guidance" class="guidance-box">先选择一个业务主体，再进入对应行业的数字化转型挑战。</div>
      </section>

      <section class="sidebar-block history-block">
        <div class="block-heading">
          <p class="eyebrow">Decision Trail</p>
          <h2>决策轨迹</h2>
        </div>
        <ol id="history-list" class="history-list"></ol>
      </section>
    </aside>
  </main>

  <div id="ending-modal" class="ending-modal hidden" role="dialog" aria-modal="true" aria-labelledby="ending-title">
    <div class="ending-card">
      <p class="eyebrow">Final Outcome</p>
      <h2 id="ending-title"></h2>
      <p id="ending-body" class="ending-body"></p>
      <div id="ending-summary" class="ending-summary"></div>
      <div class="ending-actions">
        <button id="restart-button" class="primary-button" type="button">再挑战一次</button>
      </div>
    </div>
  </div>

  <script src="story-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
